services:
  # 1. FastAPI Full-Stack / Backend Web Service
  - type: web
    name: smartmed-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Supply your external MySQL connection string in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: CORS_ORIGINS
        value: "*"

  # 2. Optional Dedicated Frontend Static Site
  - type: static
    name: smartmed-web
    region: oregon
    plan: free
    publishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
