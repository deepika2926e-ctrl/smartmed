<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - SmartMed Healthcare Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: radial-gradient(circle at top right, var(--primary-light), var(--bg-page) 60%);">

  <header class="public-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-smart">
        <i class="fa-solid fa-notes-medical"></i>
        <span>Smart<strong style="color:var(--navy);">Med</strong></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <button class="theme-toggle-btn btn btn-sm btn-outline-secondary rounded-circle" style="width:38px;height:38px;">
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="register.html" class="btn btn-sm btn-outline-primary px-3 rounded-pill">Create Account</a>
      </div>
    </div>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon primary mx-auto mb-3" style="width:56px; height:56px;">
              <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="fw-bold mb-1">Patient Sign In</h3>
            <p class="text-muted small">Access your medications and reminder schedules</p>
          </div>

          <div id="loginErrorAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label-smart" for="loginEmail">
                <i class="fa-regular fa-envelope text-primary"></i> Email Address
              </label>
              <input type="email" id="loginEmail" class="form-control-smart" required placeholder="name@example.com" autofocus>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label-smart mb-0" for="loginPassword">
                  <i class="fa-solid fa-key text-primary"></i> Password
                </label>
              </div>
              <div class="position-relative">
                <input type="password" id="loginPassword" class="form-control-smart pe-5" required placeholder="Enter your password">
                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted border-0 bg-transparent pe-3" onclick="togglePasswordVisibility('loginPassword', this)">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
              </div>
              <a href="#" onclick="showForgotPasswordInfo()" class="small text-decoration-none">Forgot?</a>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary-smart w-100 py-2">
              <span id="loginBtnText">Sign In</span>
              <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <!-- Quick Test Demo Helper -->
          <div class="mt-4 pt-3 border-top text-center">
            <button class="btn btn-sm btn-outline-secondary w-100 mb-2 py-1" onclick="fillDemoUser('patient@smartmed.com', 'Patient@123')">
              <i class="fa-solid fa-wand-magic-sparkles me-1 text-primary"></i> Fill Demo Patient Credentials
            </button>
            <p class="text-muted small mb-0">
              New to SmartMed? <a href="register.html" class="fw-semibold text-primary">Create an account</a>
            </p>
          </div>
        </div>

        <div class="text-center mt-3 text-muted small">
          <i class="fa-solid fa-lock text-success me-1"></i> End-to-end encrypted session & HIPAA-aligned privacy.
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-regular fa-eye-slash";
      } else {
        input.type = "password";
        icon.className = "fa-regular fa-eye";
      }
    }

    function fillDemoUser(email, pass) {
      document.getElementById("loginEmail").value = email;
      document.getElementById("loginPassword").value = pass;
      showToast("Demo credentials filled. Click Sign In!", "info");
    }

    function showForgotPasswordInfo() {
      alert("For privacy and safety, password resets can be requested from your healthcare administrator or by changing your password inside Settings when logged in.");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorAlert = document.getElementById("loginErrorAlert");
      const btnText = document.getElementById("loginBtnText");
      const btnSpinner = document.getElementById("loginBtnSpinner");
      const submitBtn = document.getElementById("loginSubmitBtn");

      errorAlert.classList.add("d-none");
      btnText.classList.add("d-none");
      btnSpinner.classList.remove("d-none");
      submitBtn.disabled = true;

      try {
        const res = await SmartMedAPI.auth.login(email, password);
        AuthStorage.setToken(res.access_token);
        AuthStorage.setUser(res.user);
        showToast(`Welcome back, ${res.user.full_name}!`, "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 600);
      } catch (err) {
        errorAlert.textContent = err.message || "Invalid credentials. Please verify your email and password.";
        errorAlert.classList.remove("d-none");
        btnText.classList.remove("d-none");
        btnSpinner.classList.add("d-none");
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
