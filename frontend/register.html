<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SmartMed Healthcare Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: radial-gradient(circle at top left, var(--secondary-light), var(--bg-page) 60%);">

  <header class="public-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-smart">
        <i class="fa-solid fa-notes-medical"></i>
        <span>Smart<strong style="color:var(--navy);">Med</strong></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <button class="theme-toggle-btn btn btn-sm btn-outline-secondary rounded-circle" style="width:38px;height:38px;">
          <i class="fa-solid fa-moon"></i>
        </button>
        <a href="login.html" class="btn btn-sm btn-outline-primary px-3 rounded-pill">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6 col-xl-5">
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon secondary mx-auto mb-3" style="width:56px; height:56px;">
              <i class="fa-solid fa-user-plus"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Patient Account</h3>
            <p class="text-muted small">Begin tracking medications and receiving timely alerts</p>
          </div>

          <div id="registerErrorAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
              <label class="form-label-smart" for="regFullName">
                <i class="fa-regular fa-user text-primary"></i> Full Legal Name *
              </label>
              <input type="text" id="regFullName" class="form-control-smart" required placeholder="e.g. Sarah Jenkins">
            </div>

            <div class="mb-3">
              <label class="form-label-smart" for="regEmail">
                <i class="fa-regular fa-envelope text-primary"></i> Email Address *
              </label>
              <input type="email" id="regEmail" class="form-control-smart" required placeholder="sarah@example.com">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label class="form-label-smart" for="regPhone">
                  <i class="fa-solid fa-phone text-primary"></i> Phone Number
                </label>
                <input type="tel" id="regPhone" class="form-control-smart" placeholder="+1 (555) 000-0000">
              </div>
              <div class="col-sm-6">
                <label class="form-label-smart" for="regEmergency">
                  <i class="fa-solid fa-heart-pulse text-danger"></i> Emergency Contact
                </label>
                <input type="text" id="regEmergency" class="form-control-smart" placeholder="Name & Phone">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label-smart" for="regPassword">
                <i class="fa-solid fa-key text-primary"></i> Password *
              </label>
              <div class="position-relative">
                <input type="password" id="regPassword" class="form-control-smart pe-5" required minlength="6" placeholder="At least 6 characters" oninput="checkPasswordStrength(this.value)">
                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted border-0 bg-transparent pe-3" onclick="togglePasswordVisibility('regPassword', this)">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
              <!-- Strength Bar -->
              <div class="progress mt-2" style="height: 4px;">
                <div id="pwdStrengthBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%;"></div>
              </div>
              <small id="pwdStrengthText" class="text-muted" style="font-size:0.75rem;">Password strength</small>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="regAgreeTerms" required>
              <label class="form-check-label small text-muted" for="regAgreeTerms">
                I understand SmartMed is an educational tracking assistant and not a substitute for direct medical guidance.
              </label>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-primary-smart w-100 py-2">
              <span id="regBtnText">Complete Registration</span>
              <span id="regBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center">
            <p class="text-muted small mb-0">
              Already have an account? <a href="login.html" class="fw-semibold text-primary">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-regular fa-eye-slash";
      } else {
        input.type = "password";
        icon.className = "fa-regular fa-eye";
      }
    }

    function checkPasswordStrength(val) {
      const bar = document.getElementById("pwdStrengthBar");
      const text = document.getElementById("pwdStrengthText");
      let strength = 0;
      if (val.length >= 6) strength += 25;
      if (val.length >= 10) strength += 25;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength += 25;
      if (/\d/.test(val) || /[^A-Za-z0-9]/.test(val)) strength += 25;

      bar.style.width = strength + "%";
      if (strength <= 25) {
        bar.className = "progress-bar bg-danger";
        text.textContent = "Weak password (add numbers or uppercase)";
      } else if (strength <= 50) {
        bar.className = "progress-bar bg-warning";
        text.textContent = "Fair password";
      } else if (strength <= 75) {
        bar.className = "progress-bar bg-info";
        text.textContent = "Good password";
      } else {
        bar.className = "progress-bar bg-success";
        text.textContent = "Strong password!";
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById("regFullName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const phone = document.getElementById("regPhone").value.trim();
      const emergency_contact = document.getElementById("regEmergency").value.trim();
      const errorAlert = document.getElementById("registerErrorAlert");
      const btnText = document.getElementById("regBtnText");
      const btnSpinner = document.getElementById("regBtnSpinner");
      const submitBtn = document.getElementById("regSubmitBtn");

      errorAlert.classList.add("d-none");
      btnText.classList.add("d-none");
      btnSpinner.classList.remove("d-none");
      submitBtn.disabled = true;

      try {
        const res = await SmartMedAPI.auth.register({
          full_name,
          email,
          password,
          phone: phone || null,
          emergency_contact: emergency_contact || null
        });

        AuthStorage.setToken(res.access_token);
        AuthStorage.setUser(res.user);
        showToast("Account created successfully! Welcome to SmartMed.", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (err) {
        errorAlert.textContent = err.message || "Failed to register. Please check your information.";
        errorAlert.classList.remove("d-none");
        btnText.classList.remove("d-none");
        btnSpinner.classList.add("d-none");
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
